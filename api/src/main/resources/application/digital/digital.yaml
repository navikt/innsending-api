post:
  summary: Submit application
  operationId: submitDigitalApplication
  security:
  - idporten: []

  parameters:
    - $ref: "../../common/components.yaml#/components/parameters/InnsendingsId"
    - $ref: "../../common/components.yaml#/components/parameters/EnvQualifier"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../common.yaml#/components/schemas/SubmitApplicationRequest"

  responses:
    201:
      $ref: "../common.yaml#/components/responses/ApplicationSubmissionSuccess"
    401:
      $ref: "../../common/components.yaml#/components/responses/AuthError"
    403:
      $ref: "../../common/components.yaml#/components/responses/AuthError"
    500:
      $ref: "../../common/components.yaml#/components/responses/InteralServerError"
  tags:
    - fyllut

delete:
  summary: Delete a digital application
  operationId: deleteDigitalApplication
  security:
  - idporten: []

  parameters:
    - $ref: "../../common/components.yaml#/components/parameters/InnsendingsId"

  responses:
    204:
      description: No Content
    401:
      $ref: "../../common/components.yaml#/components/responses/AuthError"
    403:
      $ref: "../../common/components.yaml#/components/responses/AuthError"
    404:
      description: Application not found or not available to the authenticated user
      content:
        application/json:
          schema:
            $ref: "../../common/components.yaml#/components/schemas/RestErrorResponseDto"
    500:
      $ref: "../../common/components.yaml#/components/responses/InteralServerError"
  tags:
    - fyllut

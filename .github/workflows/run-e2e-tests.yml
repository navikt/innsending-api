name: Run e2e tests

on:
  pull_request:

jobs:
  run-e2e-tests:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: e2e-m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            e2e-m2-${{ runner.os }}-

      - name: 'Build archiving components'
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@main
        with:
          component_names: |
            innsending-api@${{ github.head_ref }}
            arkiv-mock
            soknadsmottaker
            soknadsarkiverer
          prepull_test_images: true
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: 'Run e2e tests'
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@main
        with:
          component_name: archiving-infrastructure
          sub_directory: system-tests
          skip_tests: false
          run_docker_build: false
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}
